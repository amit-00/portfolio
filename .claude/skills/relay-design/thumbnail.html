<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;height:100%}.t{width:1280px;height:854px;display:grid;grid-template-columns:960px 320px}
.m{background:var(--ink-1);display:flex;align-items:center;justify-content:center}
.w{font-family:var(--font-mono);font-weight:700;font-size:190px;letter-spacing:-.04em;color:#fbfbfa;line-height:1}
.s{display:grid;grid-template-rows:repeat(4,1fr)}</style></head>
<body><div class="t">
<div class="m"><div class="w">Relay</div></div>
<div class="s">
<div style="background:var(--warning)"></div>
<div style="background:var(--danger)"></div>
<div style="background:var(--success)"></div>
<div style="background:var(--accent)"></div>
</div>
</div></body></html>
