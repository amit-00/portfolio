<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 24px;background:var(--surface-page)}.k{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint)}</style></head><body>
<div style="display:flex;gap:0"><div style="flex:1"><div style="height:56px;background:var(--ink-1);border:1px solid var(--rule)"></div><div class="k" style="margin-top:8px;color:var(--ink-1)">ink-1</div><div class="k" style="margin-top:2px">--ink-1</div></div><div style="flex:1"><div style="height:56px;background:var(--ink-2);border:1px solid var(--rule)"></div><div class="k" style="margin-top:8px;color:var(--ink-1)">ink-2</div><div class="k" style="margin-top:2px">--ink-2</div></div><div style="flex:1"><div style="height:56px;background:var(--ink-3);border:1px solid var(--rule)"></div><div class="k" style="margin-top:8px;color:var(--ink-1)">ink-3</div><div class="k" style="margin-top:2px">--ink-3</div></div><div style="flex:1"><div style="height:56px;background:var(--ink-4);border:1px solid var(--rule)"></div><div class="k" style="margin-top:8px;color:var(--ink-1)">ink-4</div><div class="k" style="margin-top:2px">--ink-4</div></div><div style="flex:1"><div style="height:56px;background:var(--ink-5);border:1px solid var(--rule)"></div><div class="k" style="margin-top:8px;color:var(--ink-1)">ink-5</div><div class="k" style="margin-top:2px">--ink-5</div></div><div style="flex:1"><div style="height:56px;background:var(--ink-6);border:1px solid var(--rule)"></div><div class="k" style="margin-top:8px;color:var(--ink-1)">ink-6</div><div class="k" style="margin-top:2px">--ink-6</div></div></div>
</body></html>
