<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 24px;background:var(--surface-page)}.k{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint)}</style></head><body>
<div style="display:flex;gap:0"><div style="flex:1"><div style="height:56px;background:var(--accent);border:1px solid var(--rule)"></div><div class="k" style="margin-top:8px;color:var(--ink-1)">accent</div><div class="k" style="margin-top:2px">--accent</div></div><div style="flex:1"><div style="height:56px;background:var(--accent-hover);border:1px solid var(--rule)"></div><div class="k" style="margin-top:8px;color:var(--ink-1)">accent-hover</div><div class="k" style="margin-top:2px">--accent-hover</div></div><div style="flex:1"><div style="height:56px;background:var(--accent-wash);border:1px solid var(--rule)"></div><div class="k" style="margin-top:8px;color:var(--ink-1)">accent-wash</div><div class="k" style="margin-top:2px">--accent-wash</div></div></div><div class="k" style="margin-top:12px">Accent never fills a button, a heading or a background block.</div>
</body></html>
