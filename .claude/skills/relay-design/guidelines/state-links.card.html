<!-- @dsCard group="Motion" viewport="700x150" name="Links & focus" subtitle="Accent is reserved for links and focus rings" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 24px;background:var(--surface-page)}
.k{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint)}
p{font-size:15.5px;line-height:1.68;color:var(--ink-2);max-width:60ch;margin:12px 0 0}
a.h{color:var(--accent-hover)}
.f{display:inline-block;margin-top:14px;padding:7px 10px;border:1px solid var(--rule);background:var(--surface-raised);font-family:var(--font-sans);font-size:14.5px;color:var(--ink-1);outline:2px solid var(--accent);outline-offset:2px}</style></head><body>
<div class="k">--accent oklch(0.45 0.09 250) &middot; links only, never fills</div>
<p>Read the <a href="#">replication log</a> instead of publishing twice; on hover the link goes <a class="h" href="#">one step darker</a> and keeps its underline.</p>
<div class="f">focused field</div>
</body></html>
