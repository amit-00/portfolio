<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 24px;background:var(--surface-page)}.k{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint)}</style></head><body>
<div style="display:flex;gap:0"><div style="flex:1"><div style="height:56px;background:var(--surface-page);border:1px solid var(--rule)"></div><div class="k" style="margin-top:8px;color:var(--ink-1)">surface-page</div><div class="k" style="margin-top:2px">--surface-page</div></div><div style="flex:1"><div style="height:56px;background:var(--surface-sunken);border:1px solid var(--rule)"></div><div class="k" style="margin-top:8px;color:var(--ink-1)">surface-sunken</div><div class="k" style="margin-top:2px">--surface-sunken</div></div><div style="flex:1"><div style="height:56px;background:var(--surface-fill);border:1px solid var(--rule)"></div><div class="k" style="margin-top:8px;color:var(--ink-1)">surface-fill</div><div class="k" style="margin-top:2px">--surface-fill</div></div><div style="flex:1"><div style="height:56px;background:var(--surface-raised);border:1px solid var(--rule)"></div><div class="k" style="margin-top:8px;color:var(--ink-1)">surface-raised</div><div class="k" style="margin-top:2px">--surface-raised</div></div><div style="flex:1"><div style="height:56px;background:var(--surface-inverse);border:1px solid var(--rule)"></div><div class="k" style="margin-top:8px;color:var(--ink-1)">surface-inverse</div><div class="k" style="margin-top:2px">--surface-inverse</div></div></div>
</body></html>
