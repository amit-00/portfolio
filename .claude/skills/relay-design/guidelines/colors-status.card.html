<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 24px;background:var(--surface-page)}.k{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint)}</style></head><body>
<div style="display:flex;gap:0"><div style="flex:1"><div style="height:56px;background:var(--warning);border:1px solid var(--rule)"></div><div class="k" style="margin-top:8px;color:var(--ink-1)">warning</div><div class="k" style="margin-top:2px">--warning</div></div><div style="flex:1"><div style="height:56px;background:var(--warning-wash);border:1px solid var(--rule)"></div><div class="k" style="margin-top:8px;color:var(--ink-1)">warning-wash</div><div class="k" style="margin-top:2px">--warning-wash</div></div><div style="flex:1"><div style="height:56px;background:var(--danger);border:1px solid var(--rule)"></div><div class="k" style="margin-top:8px;color:var(--ink-1)">danger</div><div class="k" style="margin-top:2px">--danger</div></div><div style="flex:1"><div style="height:56px;background:var(--danger-wash);border:1px solid var(--rule)"></div><div class="k" style="margin-top:8px;color:var(--ink-1)">danger-wash</div><div class="k" style="margin-top:2px">--danger-wash</div></div><div style="flex:1"><div style="height:56px;background:var(--success);border:1px solid var(--rule)"></div><div class="k" style="margin-top:8px;color:var(--ink-1)">success</div><div class="k" style="margin-top:2px">--success</div></div><div style="flex:1"><div style="height:56px;background:var(--success-wash);border:1px solid var(--rule)"></div><div class="k" style="margin-top:8px;color:var(--ink-1)">success-wash</div><div class="k" style="margin-top:2px">--success-wash</div></div></div>
</body></html>
