<!-- @dsCard group="Spacing" viewport="700x160" name="Rule hierarchy" subtitle="Hierarchy comes from rule weight, not shadow" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 24px;background:var(--surface-page)}.k{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint)}</style></head><body>
<div style="display:flex;flex-direction:column;gap:18px"><div><div style="border-top:1px solid var(--rule-strong)"></div><div class="k" style="margin-top:6px">rule-strong &middot; page bar, table head, pager</div></div><div><div style="border-top:1px solid var(--rule)"></div><div class="k" style="margin-top:6px">rule &middot; section splits, table rows, boxes</div></div><div><div style="border-top:1px solid var(--rule-soft)"></div><div class="k" style="margin-top:6px">rule-soft &middot; nested lists inside a box</div></div></div>
</body></html>
